name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets, no database, no API calls.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate (no database)
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        if: ${{ hashFiles('.eslintrc*', 'eslint.config.*') != '' }}
        run: npm run lint --if-present

      - name: Unit tests
        run: npm run test:unit
